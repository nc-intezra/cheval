# Apache 2.4 site for serving a cheval mirror to APT clients (offline or connected side).
#
#   a2enmod headers
#   cp apache-cheval.conf /etc/apache2/sites-available/cheval.conf
#   a2ensite cheval && apachectl configtest && systemctl reload apache2
#
# Clients then use the upstream host and path under this server, e.g.
#   deb http://mirror.lan/archive.ubuntu.com/ubuntu noble main
# (`cheval sources --base-url http://mirror.lan` prints the lines for every repository.)
<VirtualHost *:80>
    ServerName mirror.lan

    # base_path/mirror from cheval.toml
    DocumentRoot /srv/cheval/mirror

    <Directory /srv/cheval/mirror>
        Options +Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Read-only: GET (and HEAD) only.
        <LimitExcept GET>
            Require all denied
        </LimitExcept>
        # Serve every file byte for byte. Debian's defaults can otherwise label *.gz with a
        # gzip Content-Encoding or compress responses on the fly, and APT would then see bytes
        # that do not match the checksums in Release.
        RemoveEncoding .gz .bz2 .xz .zst .lz4 .Z
        SetEnv no-gzip 1
        IndexOptions FancyIndexing NameWidth=* SuppressDescription
    </Directory>

    # Never serve cheval's own files or files still being written (*.cheval-new).
    <LocationMatch "(/\.|\.cheval-new$)">
        Require all denied
    </LocationMatch>

    <IfModule mod_headers.c>
        # Release files change at every update: clients must always revalidate them.
        <LocationMatch "/(InRelease|Release|Release\.gpg)$">
            Header set Cache-Control "no-cache"
        </LocationMatch>
        # Packages and by-hash indices never change under the same name.
        <LocationMatch "/(pool|by-hash)/">
            Header set Cache-Control "public, max-age=604800, immutable"
        </LocationMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/cheval-error.log
    CustomLog ${APACHE_LOG_DIR}/cheval-access.log combined
</VirtualHost>
