# Apache 2.4 virtual hosts for package registries mirrored by cheval (0.9.0), for a network
# whose DNS points the upstream names at this server (for example a response policy zone):
#
#   index.crates.io  static.crates.io  proxy.golang.org  repo.maven.apache.org
#
# cargo, go and mvn speak HTTPS to those names, so each virtual host needs a certificate
# for its name that clients trust (an internal CA, installed on every client:
# /usr/local/share/ca-certificates + update-ca-certificates on Debian/Ubuntu,
# /etc/pki/ca-trust/source/anchors + update-ca-trust on RHEL-likes; Java uses its own
# trust store: keytool -importcert -cacerts, or -Djavax.net.ssl.trustStore).
#
#   a2enmod ssl headers
#   cp apache-registries.conf /etc/apache2/sites-available/cheval-registries.conf
#   a2ensite cheval-registries && apachectl configtest && systemctl reload apache2
#
# Paths below assume base_path = "/srv/cheval" and no mirror_dir: cheval stores each
# host under /srv/cheval/mirror/<host>/.

# Shared settings: read-only, byte-for-byte, never cheval's own or half-written files.
<Directory /srv/cheval/mirror>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    <LimitExcept GET>
        Require all denied
    </LimitExcept>
    RemoveEncoding .gz .bz2 .xz .zst .lz4 .Z
    SetEnv no-gzip 1
</Directory>
<LocationMatch "(/\.|\.cheval-new$|\.cheval-part$)">
    Require all denied
</LocationMatch>

# ---------------------------------------------------------------- crates.io: sparse index
<VirtualHost *:443>
    ServerName index.crates.io
    DocumentRoot /srv/cheval/mirror/index.crates.io
    SSLEngine on
    SSLCertificateFile    /etc/ssl/cheval/index.crates.io.crt
    SSLCertificateKeyFile /etc/ssl/cheval/index.crates.io.key
    # Index files change when versions are added: cargo revalidates with ETag/Last-Modified.
    Header set Cache-Control "no-cache"
    ErrorLog ${APACHE_LOG_DIR}/cheval-crates-error.log
    CustomLog ${APACHE_LOG_DIR}/cheval-crates-access.log combined
</VirtualHost>

# ---------------------------------------------------------------- crates.io: crate files
<VirtualHost *:443>
    ServerName static.crates.io
    DocumentRoot /srv/cheval/mirror/static.crates.io
    SSLEngine on
    SSLCertificateFile    /etc/ssl/cheval/static.crates.io.crt
    SSLCertificateKeyFile /etc/ssl/cheval/static.crates.io.key
    # cargo asks for /crates/<name>/<version>/download; the file is stored under that name.
    <LocationMatch "^/crates/">
        ForceType application/octet-stream
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>

# ---------------------------------------------------------------- Go module proxy
<VirtualHost *:443>
    ServerName proxy.golang.org
    DocumentRoot /srv/cheval/mirror/proxy.golang.org
    SSLEngine on
    SSLCertificateFile    /etc/ssl/cheval/proxy.golang.org.crt
    SSLCertificateKeyFile /etc/ssl/cheval/proxy.golang.org.key
    # Module paths and versions may hold '!' and '+' (escaping, +incompatible): served as is.
    <LocationMatch "/@v/list$">
        ForceType "text/plain; charset=utf-8"
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "\.info$">
        ForceType application/json
    </LocationMatch>
    <LocationMatch "\.(info|mod|zip)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # The go command treats 404 and 410 as "not here"; anything else as a hard error.
</VirtualHost>

# ---------------------------------------------------------------- Maven Central
<VirtualHost *:443>
    ServerName repo.maven.apache.org
    DocumentRoot /srv/cheval/mirror/repo.maven.apache.org
    SSLEngine on
    SSLCertificateFile    /etc/ssl/cheval/repo.maven.apache.org.crt
    SSLCertificateKeyFile /etc/ssl/cheval/repo.maven.apache.org.key
    <LocationMatch "/maven-metadata\.xml(\.sha1)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "\.(jar|pom|war|aar|module)(\.sha1)?$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>

# Maven clients also look up repo1.maven.org (older settings) and Gradle uses
# repo.maven.apache.org too; an alias here covers the former:
#   ServerAlias repo1.maven.org   (and a certificate naming both)
