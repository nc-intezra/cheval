# nginx site for serving a cheval mirror to APT clients (offline or connected side).
#
#   cp nginx-cheval.conf /etc/nginx/sites-available/cheval
#   ln -s ../sites-available/cheval /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# Clients then use the upstream host and path under this server, e.g.
#   deb http://mirror.lan/archive.ubuntu.com/ubuntu noble main
# (`cheval sources --base-url http://mirror.lan` prints the lines for every repository.)
server {
    listen 80;
    listen [::]:80;
    server_name mirror.lan;

    # base_path/mirror from cheval.toml
    root /srv/cheval/mirror;

    autoindex on;              # browsable, which helps when pointing clients at the right path
    autoindex_exact_size off;
    sendfile on;
    tcp_nopush on;

    # Read-only: GET and HEAD only.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Never serve cheval's own files or files still being written (*.cheval-new).
    location ~ /\. { deny all; }
    location ~ \.cheval-new$ { deny all; }

    # Release files change at every update: clients must always revalidate them.
    location ~ /(InRelease|Release|Release\.gpg)$ {
        add_header Cache-Control "no-cache";
    }
    # Packages and by-hash indices never change under the same name.
    location ~ /(pool|by-hash)/ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
