[workspace]
members = [".", "crates/*"]
# `cargo build/test/clippy` at the top cover every crate.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
# The release workflow reads the first `version = "…"` line of this file: keep it here.
version = "0.7.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nc-intezra/cheval"

[workspace.dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
libc = "0.2"
liblzma = { version = "0.4.9", features = ["static"] }
md-5 = "0.11.0"
percent-encoding = "2.3.2"
pgp = "0.21.1"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net"] }
tokio-util = "0.7.20"
toml = "1.2.1"
url = "2.5.8"
walkdir = "2.5.0"
zstd = { version = "0.14.4", features = ["zstdmt"] }
tempfile = "3.27.0"
cheval-core = { path = "crates/cheval-core" }
cheval-status = { path = "crates/cheval-status" }
cheval-apt = { path = "crates/cheval-apt" }
cheval-bundle = { path = "crates/cheval-bundle" }
cheval-tui = { path = "crates/cheval-tui" }

[package]
name = "cheval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Consistent, verified APT repository mirroring with a terminal UI"
readme = "README.md"
keywords = ["apt", "mirror", "debian", "ubuntu", "tui"]
categories = ["command-line-utilities"]

[dependencies]
cheval-core.workspace = true
cheval-status.workspace = true
cheval-apt.workspace = true
cheval-bundle.workspace = true
cheval-tui.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
regex.workspace = true
walkdir.workspace = true
zstd.workspace = true
flate2.workspace = true
hex.workspace = true
liblzma.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
