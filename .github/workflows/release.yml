name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  static-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          name="cheval-${GITHUB_REF_NAME}-x86_64-linux-musl"
          mkdir "$name"
          cp target/x86_64-unknown-linux-musl/release/cheval README.md LICENSE CHANGELOG.md "$name/"
          cp -r examples contrib "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "cheval $GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" cheval-*.tar.gz cheval-*.sha256 --clobber
